name: Deploy static site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline shell
        run: node scripts/generate-sw.cjs
      - name: Run unit regressions
        run: node --test tests/*.test.cjs
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/passwmana-browser" --no-save --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/passwmana-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE_PATH=$RUNNER_TEMP/passwmana-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "BROWSER_EXECUTABLE=$(node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/passwmana-browser/node_modules/playwright")" >> "$GITHUB_ENV"
          echo "BROWSER_SCREENSHOT_DIR=$RUNNER_TEMP/passwmana-screenshots" >> "$GITHUB_ENV"
      - name: Run desktop and mobile interaction checks
        run: node tests/browser-check.cjs
      - name: Run real service worker and offline checks
        run: node tests/pwa-browser-check.cjs
      - name: Verify final offline hashes
        run: node scripts/generate-sw.cjs --check
      - name: Upload interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-screenshots
          path: ${{ runner.temp }}/passwmana-screenshots/*.png
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare public application files
        run: |
          node scripts/generate-sw.cjs
          node scripts/prepare-pages.cjs "$RUNNER_TEMP/passwmana-site"
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/passwmana-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
